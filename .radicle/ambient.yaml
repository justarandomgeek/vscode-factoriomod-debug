pre_plan:
  - action: npm_get
plan:
  - action: shell
    shell: |
      echo "node: $(node --version)"
      echo "npm: $(npm --version)"
      echo "vsce: $(vsce --version)"
      echo "ovsx: $(ovsx --version)"
  - action: shell
    shell: |
      find /ci/deps/npm/ -name "*.tgz" -type f -exec npm cache add {} \;
      npm install --offline
  - action: shell
    shell: |
      npm version "$(jq -r .version package.json | cut -d- -f1)-$(git describe --long | cut -d- -f3)" --git-tag-version=false --allow-same-version
  - action: mkdir
    pathname: /ci/artifacts/npm
  - action: mkdir
    pathname: /ci/artifacts/vsce
  - action: shell
    shell: |
      vsce pack --out /ci/artifacts/vsce/
      npm pack --ignore-scripts --pack-destination /ci/artifacts/npm/
  - action: shell
    shell: |
      rm -r ./test/factorio
      ln -s /opt/factorio ./test/factorio
      ./test/factorio/bin/x64/factorio --dump-data
  - action: shell
    shell: |
      npm run test
  - action: shell
    shell: |
      cp out/meta.json out/stats.html /ci/artifacts/
      cp -r coverage/lcov-report /ci/artifacts/lcov-report

