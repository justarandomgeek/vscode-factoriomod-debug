pre_plan:
  - action: npm_get
  - action: http_get
    items:
    - url: https://nodejs.org/download/release/v24.18.1/node-v24.18.1-linux-x64.tar.xz
      filename: node.tar.xz
    - url: https://factorio.com/get-download/experimental/headless/linux64
      filename: factorio.tar.xz
plan:
  - action: shell
    shell: |
      tar xJf /ci/deps/node.tar.xz -C /usr/local --strip-components=1
  - action: shell
    shell: |
      find /ci/deps/npm/ -name "*.tgz" -type f -exec npm cache add {} \;
      npm install --offline
  - action: shell
    shell: |
      npm pack
  - action: shell
    shell: |
      tar xJf /ci/deps/factorio.tar.xz -C ./test
  - action: shell
    shell: |
      ./test/factorio/bin/x64/factorio --dump-data
  - action: shell
    shell: |
      npm run test
  - action: shell
    shell: |
      mkdir /ci/artifacts/npm
      cp ./*.tgz /ci/artifacts/npm/
      mkdir /ci/artifacts/vsce
      cp ./*.vsix /ci/artifacts/vsce/
      cp out/meta.json out/stats.html /ci/artifacts/
      cp -r coverage/lcov-report /ci/artifacts/lcov-report
