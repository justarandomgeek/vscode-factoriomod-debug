pre_plan:
  - action: npm_get
plan:
  - action: shell
    shell: |
      npm cache add /ci/deps/npm/*.tgz
      npm install --offline
      npm pack
      npm run test
      cp ./*.tgz /ci/artifacts/npm/
      cp ./*.vsix /ci/artifacts/vsce/
      cp out/meta.json out/stats.html coverage /ci/artifacts/

