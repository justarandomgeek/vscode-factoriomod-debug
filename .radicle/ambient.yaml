pre_plan:
  - action: npm_get
plan:
  - action: shell
    shell: |
      find /ci/deps/npm/ -name "*.tgz" -type f -print0 | while IFS= read -r -d '' file; do
        npm cache add "$file"
      done
  - action: shell
    shell: |
      npm install --offline
  - action: shell
    shell: |
      npm pack
  - action: shell
    shell: |
      npm run test
  - action: shell
    shell: |
      cp ./*.tgz /ci/artifacts/npm/
      cp ./*.vsix /ci/artifacts/vsce/
      cp out/meta.json out/stats.html coverage /ci/artifacts/
