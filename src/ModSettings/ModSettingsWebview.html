<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<!--
	Use a content security policy to only allow loading images from https or from our extension directory,
	and only allow scripts that have a specific nonce.
	-->
	<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src $cspSource$; style-src $cspSource$; font-src $cspSource$; script-src 'nonce-$nonce$';">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link href="$ModSettingsWebview.css$" rel="stylesheet" />
	<title>Mod Settings</title>
</head>
<body>
	<section>
		<vscode-label for="version">Version: <span class="normal" id="version"></span></vscode-label>
	</section>

	<vscode-tabs aria-label="Settings">
		<vscode-tab-header slot="header">Startup</vscode-tab-header>
		<vscode-tab-panel>
			<vscode-table zebra>
				<vscode-table-body slot="body" id="startup"></vscode-table-body>
			</vscode-table>
		</vscode-tab-panel>
		<vscode-tab-header slot="header">Runtime Global</vscode-tab-header>
		<vscode-tab-panel>
			<vscode-table zebra>
				<vscode-table-body slot="body" id="runtime-global"></vscode-table-body>
			</vscode-table>
		</vscode-tab-panel>
		<vscode-tab-header slot="header">Runtime Per User</vscode-tab-header>
		<vscode-tab-panel>
			<vscode-table zebra>
				<vscode-table-body slot="body" id="runtime-per-user"></vscode-table-body>
			</vscode-table>
		</vscode-tab-panel>
	</vscode-tabs>

	<template id="setting-string">
		<vscode-table-row>
			<vscode-table-cell class="setting-name"></vscode-table-cell>
			<vscode-table-cell>
				<vscode-textfield class="setting-value"></vscode-textfield>
			</vscode-table-cell>
			<vscode-table-cell class="setting-controls">
				<vscode-button class="setting-delete" appearance="icon" aria-label="Delete">
					<span class="codicon codicon-trash"></span>
				</vscode-button>
			</vscode-table-cell>
		</vscode-table-row>
	</template>

	<template id="setting-number">
		<vscode-table-row>
			<vscode-table-cell class="setting-name"></vscode-table-cell>
			<vscode-table-cell>
				<vscode-textfield class="setting-value"></vscode-textfield>
			</vscode-table-cell>
			<vscode-table-cell class="setting-controls">
				<vscode-button class="setting-delete" appearance="icon" aria-label="Delete">
					<span class="codicon codicon-trash"></span>
				</vscode-button>
			</vscode-table-cell>
		</vscode-table-row>
	</template>

	<template id="setting-bool">
		<vscode-table-row>
			<vscode-table-cell class="setting-name"></vscode-table-cell>
			<vscode-table-cell>
				<vscode-checkbox class="setting-value"></vscode-checkbox>
			</vscode-table-cell>
			<vscode-table-cell class="setting-controls">
				<vscode-button class="setting-delete" appearance="icon" aria-label="Delete">
					<span class="codicon codicon-trash"></span>
				</vscode-button>
			</vscode-table-cell>
		</vscode-table-row>
	</template>

	<template id="setting-color">
		<vscode-table-row>
			<vscode-table-cell class="setting-name"></vscode-table-cell>
			<vscode-table-cell>
				<label>Color:</label>
				<input type="color" class="setting-value setting-color-value"/>
				<label>Alpha:</label>
				<vscode-textfield class="setting-value setting-a-value"></vscode-textfield>
			</vscode-table-cell>
			<vscode-table-cell class="setting-controls">
				<vscode-button class="setting-delete" appearance="icon" aria-label="Delete">
					<span class="codicon codicon-trash"></span>
				</vscode-button>
			</vscode-table-cell>
		</vscode-table-row>
	</template>

	<template id="setting-add">
		<vscode-table-row>
			<vscode-table-cell>
				<vscode-textfield class="setting-add-name"></vscode-textfield>
			</vscode-table-cell>
			<vscode-table-cell>
				<vscode-single-select class="setting-add-type">
					<vscode-option>string</vscode-option>
					<vscode-option>bool</vscode-option>
					<vscode-option>number</vscode-option>
					<vscode-option hidden>int</vscode-option>
					<vscode-option>color</vscode-option>
				</vscode-single-select>
			</vscode-table-cell>
			<vscode-table-cell class="setting-controls">
				<vscode-button class="setting-addbtn" appearance="icon" aria-label="Add">
					<span class="codicon codicon-add"></span>
				</vscode-button>
			</vscode-table-cell>
		</vscode-table-row>
	</template>

	<script type="module" nonce="$nonce$" src="$ModSettingsWebview.js$" defer></script>
</body>
</html>
